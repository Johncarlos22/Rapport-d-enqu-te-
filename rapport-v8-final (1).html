<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GUPS • Atelier</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#fbf8f3;--ink:#17181b;--ink-soft:#6b6e76;--line:#ece6da;--card:#fff;--accent:#111;--accent-2:#f0ebe0;--shadow:0 20px 80px rgba(0,0,0,.08);--radius:22px}
*{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font-family:"Plus Jakarta Sans",sans-serif}
.serif{font-family:"Instrument Serif",serif} .header{max-width:1280px;margin:0 auto;padding:34px 24px 10px;display:flex;align-items:baseline;justify-content:space-between}
.header h1{margin:0;font-size:38px;line-height:.9;letter-spacing:-.03em} .header h1 i{font-style:italic;font-weight:400} .header p{margin:6px 0 0;color:var(--ink-soft);font-size:13.5px}
.wrap{max-width:1280px;margin:0 auto;padding:14px 24px 20px;display:grid;grid-template-columns:340px 1fr;gap:18px}
@media(max-width:980px){.wrap{grid-template-columns:1fr} .header{flex-direction:column;gap:10px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.card h2{margin:0 0 14px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.input,textarea,select{width:100%;background:#fcfaf6;border:1px solid var(--line);border-radius:12px;padding:11px 13px;font:inherit;color:var(--ink);outline:none;transition:.2s}
.input:focus,textarea:focus{border-color:var(--ink);background:#fff} textarea{min-height:88px;resize:vertical;line-height:1.5}
label{display:block;margin:14px 0 6px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px} .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:600px){.grid2,.grid3{grid-template-columns:1fr}}
.btn{appearance:none;border:0;border-radius:999px;padding:12px 18px;font:inherit;font-weight:600;cursor:pointer;transition:.2s}
.btn-primary{background:#111;color:#fff} .btn-primary:hover{background:#000;transform:translateY(-1px)}
.btn-ghost{background:#f0ebe0;color:var(--ink)} .btn-small{padding:8px 12px;font-size:12.5px}
.dossier{border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;background:#fdfcfa;cursor:pointer} .dossier:hover{border-color:#d8d0bf} .dossier.active{background:#111;color:#fff;border-color:#111} .dossier.active small{color:#b8b8b8}
.dossier h4{margin:0;font-size:14px} .dossier small{color:var(--ink-soft);font-size:11.5px}
.sep{height:1px;background:var(--line);margin:18px 0} .row{border:1px dashed var(--line);border-radius:14px;padding:10px;margin-bottom:10px;background:#fdfcfa}
.footer-note{color:var(--ink-soft);font-size:11.5px;margin-top:10px}
.hero h3{margin:0;font-size:28px;letter-spacing:-.03em} .hero p{margin:6px 0 0;color:var(--ink-soft);font-size:13px}
.autosave{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:#177a4b;background:#e6f4ea;border:1px solid #c3e6cb;border-radius:999px;padding:4px 10px;opacity:0;transition:.3s}
.autosave.show{opacity:1}
.generate-section{max-width:1280px;margin:0 auto;padding:10px 24px 60px}
.generate-card{background:#111;color:#fff;border-radius:24px;padding:28px 24px;box-shadow:0 30px 90px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:space-between;gap:20px}
@media(max-width:700px){.generate-card{flex-direction:column;align-items:flex-start}}
.generate-card h3{margin:0;font-size:30px;letter-spacing:-.03em} .generate-card p{margin:6px 0 0;color:#b8b8b8;font-size:13.5px}
</style>
</head>
<body>
<div class="header">
  <div><h1 class="serif">Guichet Unique <i>de Protection Sociale</i></h1><p>Atelier privé — Collines, Bénin</p></div>
  <div style="display:flex;gap:8px;align-items:center">
    <span id="autoSaveBadge" class="autosave">● Auto-enregistré</span>
    <button class="btn btn-ghost btn-small" onclick="exportAll()">Exporter</button>
    <button class="btn btn-ghost btn-small" onclick="importAll()">Importer</button>
    <button class="btn btn-ghost btn-small" onclick="configSheet()">Sheet</button>
  </div>
</div>
<div class="wrap">
  <div>
    <div class="card">
      <h2>Dossiers</h2>
      <div style="display:flex;gap:8px;margin-bottom:12px"><input id="newName" class="input" placeholder="Nom du dossier"><button class="btn btn-primary btn-small" onclick="createDossier()">Nouveau</button></div>
      <div id="list"></div>
      <div id="sheetStatus" class="footer-note"></div>
    </div>
  </div>
  <div>
    <div class="card">
      <h2 id="currentName">Aucun dossier sélectionné</h2>
      <div class="grid2"><div><label>Commune GUPS</label><input id="gups" class="input auto"></div><div><label>N° dossier</label><input id="numDossier" class="input auto"></div></div>
      <div class="grid3"><div><label>Du</label><input id="collecteDu" type="date" class="input auto"></div><div><label>Au</label><input id="collecteAu" type="date" class="input auto"></div><div><label>Fait à / le</label><input id="lieu" class="input auto"></div></div>
      <div class="sep"></div>
      <div class="grid3"><div><label>Civilité</label><select id="civ" class="input auto"><option>Dame</option><option>Monsieur</option><option>Mademoiselle</option></select></div><div><label>Nom</label><input id="nom" class="input auto"></div><div><label>Prénoms</label><input id="prenoms" class="input auto"></div></div>
      <div class="grid3"><div><label>Âge</label><input id="age" class="input auto"></div><div><label>Profession</label><input id="profession" class="input auto"></div><div><label>Tél</label><input id="tel" class="input auto"></div></div>
      <label>Adresse</label><input id="adresse" class="input auto">
      <div class="grid2"><div><label>Nationalité</label><input id="nationalite" class="input auto" value="Béninoise"></div><div><label>Département</label><input id="departement" class="input auto" value="Collines"></div></div>
    </div>
    <div class="card" style="margin-top:16px"><h2>Notes d'enquête</h2><div id="notes"></div></div>
    <div class="card" style="margin-top:16px"><h2>Parties prenantes & Famille</h2><div id="parties" style="margin-bottom:12px"></div><button class="btn btn-ghost btn-small" onclick="addRow('parties','partie')">+ Partie prenante</button><div class="sep"></div><div id="famille" style="margin-bottom:12px"></div><button class="btn btn-ghost btn-small" onclick="addRow('famille','famille')">+ Membre famille</button></div>
    <div class="card" style="margin-top:16px;display:flex;gap:10px;align-items:center"><button class="btn btn-primary" onclick="saveDossier()">Enregistrer maintenant</button><button class="btn btn-ghost" onclick="deleteDossier()">Supprimer</button><span id="saveInfo" style="font-size:12px;color:#6b6e76"></span></div>
  </div>
</div>

<!-- BOUTON GENERER TOUT EN BAS -->
<div class="generate-section">
  <div class="generate-card">
    <div><h3 class="serif">Fichier pour Claude</h3><p>Un seul fichier adressé directement à Claude. Glisse-le dans Claude et regarde.</p></div>
    <button class="btn" style="background:#fff;color:#111;padding:16px 24px;font-size:15px" onclick="generateUniqueFile()">Générer le fichier pour Claude</button>
  </div>
</div>

<input type="file" id="importFile" accept=".json" style="display:none">

const NOTES_DEF=[["motif","Motif"],["famille","Situation familiale"],["matrimoniale","Situation matrimoniale"],["scolaire","Situation scolaire"],["agr","Activité génératrice"],["logement","Logement"],["constats","Constats"],["analyse","Analyse"],["besoins","Recommandations"],["complement","Compléments"]];
const PROMPT_FINAL = "CHER CLAUDE, Ce document est pour toi. Tu es redacteur officiel DDASM Collines - GUPS Benin. Ce fichier Word contient deja le canevas officiel avec son logo, entete, sections I a VII et tableaux. Ta mission: Conserver le logo et la structure du canevas. Puis avec les DONNEES DU DOSSIER ci-dessous, redige le rapport final complet. Garder les noms reels, ne pas anonymiser. Francais administratif beninois. Si info manque mettre ...... Genere le rapport final Word pret a deposer.";

let dossiers=[]; let currentId=null; let autoSaveTimer=null; let memoryFallback=false;

function loadStorage(){
  try{ var raw=localStorage.getItem('gups_v8'); var cur=localStorage.getItem('gups_v8_current'); if(raw) dossiers=JSON.parse(raw); currentId=cur||null; var sheetUrl=localStorage.getItem('gups_sheet_url'); if(sheetUrl) document.getElementById('sheetStatus').textContent='Sheet connectée'; }catch(e){ memoryFallback=true; dossiers=[]; console.warn(e); }
}
function persist(){ try{ if(!memoryFallback){ localStorage.setItem('gups_v8', JSON.stringify(dossiers)); if(currentId) localStorage.setItem('gups_v8_current', currentId); } }catch(e){} renderList(); }
function renderList(){ var el=document.getElementById('list'); if(!el) return; if(!dossiers.length){ el.innerHTML='<div style="color:#6b6e76;font-size:12.5px">Aucun dossier</div>'; return; } el.innerHTML=dossiers.map(function(d){ return '<div class="dossier '+(d.id===currentId?'active':'')+'" onclick="openDossier(\''+d.id+'\')"><h4>'+d.nom+'</h4><small>'+new Date(d.date).toLocaleDateString()+' • '+(d.data&&d.data.nom||'')+'</small></div>'; }).join(''); }
function createDossier(){ var name=document.getElementById('newName').value.trim(); if(!name){alert('Nom ?');return;} var id=Date.now().toString(); dossiers.unshift({id:id,nom:name,date:new Date().toISOString(),data:{}}); currentId=id; document.getElementById('newName').value=''; persist(); openDossier(id); }
function openDossier(id){ currentId=id; var d=dossiers.find(function(x){return x.id===id;}); if(!d) return; document.getElementById('currentName').textContent=d.nom; var data=d.data||{}; ['gups','numDossier','collecteDu','collecteAu','lieu','civ','nom','prenoms','age','profession','tel','adresse','nationalite','departement'].forEach(function(k){ var e=document.getElementById(k); if(e) e.value=data[k]||''; }); NOTES_DEF.forEach(function(p){ var e=document.getElementById(p[0]); if(e) e.value=data[p[0]]||''; }); renderRows('parties',data.parties||[]); renderRows('famille',data.famille||[]); persist(); }
function collect(){ var o={}; ['gups','numDossier','collecteDu','collecteAu','lieu','civ','nom','prenoms','age','profession','tel','adresse','nationalite','departement'].forEach(function(k){ var e=document.getElementById(k); if(e) o[k]=e.value; }); NOTES_DEF.forEach(function(p){ var e=document.getElementById(p[0]); if(e) o[p[0]]=e.value; }); o.parties=readRows('parties'); o.famille=readRows('famille'); return o; }
function saveDossier(){ if(!currentId){alert('Crée un dossier');return;} var d=dossiers.find(function(x){return x.id===currentId;}); d.data=collect(); d.date=new Date().toISOString(); persist(); document.getElementById('saveInfo').textContent='Enregistré ✓'; setTimeout(function(){document.getElementById('saveInfo').textContent='';},2000); autoBadge(); syncSheet(d); }
function autoBadge(){ var b=document.getElementById('autoSaveBadge'); b.classList.add('show'); setTimeout(function(){b.classList.remove('show');},2500); }
function autoSave(){ if(!currentId) return; clearTimeout(autoSaveTimer); autoSaveTimer=setTimeout(function(){ var d=dossiers.find(function(x){return x.id===currentId;}); if(!d) return; d.data=collect(); d.date=new Date().toISOString(); persist(); autoBadge(); syncSheet(d); }, 800); }
function syncSheet(d){ var url=localStorage.getItem('gups_sheet_url'); if(!url) return; try{ fetch(url,{method:'POST',mode:'no-cors',body:JSON.stringify({id:d.id,nom:d.nom,date:d.date,json:JSON.stringify(d)})}); document.getElementById('sheetStatus').textContent='Sync Sheet: '+d.nom; }catch(e){} }
function deleteDossier(){ if(!currentId) return; if(!confirm('Supprimer ?')) return; dossiers=dossiers.filter(function(x){return x.id!==currentId;}); currentId=null; try{localStorage.removeItem('gups_v8_current');}catch{} document.getElementById('currentName').textContent='Aucun dossier'; persist(); }
function initNotes(){ var c=document.getElementById('notes'); c.innerHTML=''; NOTES_DEF.forEach(function(p){ c.innerHTML+='<label>'+p[1]+'</label><textarea id="'+p[0]+'" class="input auto"></textarea>'; }); }
function addRow(contId,type){ var cont=document.getElementById(contId); var div=document.createElement('div'); div.className='row'; if(type==='partie') div.innerHTML='<div class="grid2"><div><label>Nom</label><input class="input auto p-nom"></div><div><label>Rôle</label><input class="input auto p-role"></div></div><button class="btn btn-ghost btn-small" style="margin-top:8px" onclick="this.parentElement.remove(); autoSave();">Retirer</button>'; else div.innerHTML='<div class="grid2"><div><label>Nom</label><input class="input auto f-nom"></div><div><label>Lien</label><input class="input auto f-lien"></div></div><div class="grid2"><div><label>Âge</label><input class="input auto f-age"></div><div><label>Occupation</label><input class="input auto f-occ"></div></div><button class="btn btn-ghost btn-small" style="margin-top:8px" onclick="this.parentElement.remove(); autoSave();">Retirer</button>'; cont.appendChild(div); attachAuto(); }
function renderRows(contId,arr){ var cont=document.getElementById(contId); cont.innerHTML=''; arr.forEach(function(item){ addRow(contId, contId==='parties'?'partie':'famille'); var last=cont.lastElementChild; if(item.nom){var e=last.querySelector('.p-nom, .f-nom'); if(e) e.value=item.nom;} if(item.role){var e=last.querySelector('.p-role'); if(e) e.value=item.role;} if(item.lien){var e=last.querySelector('.f-lien'); if(e) e.value=item.lien;} if(item.age){var e=last.querySelector('.f-age'); if(e) e.value=item.age;} if(item.occ){var e=last.querySelector('.f-occ'); if(e) e.value=item.occ;} }); }
function readRows(contId){ var cont=document.getElementById(contId); var out=[]; Array.from(cont.children).forEach(function(div){ var nom=(div.querySelector('.p-nom, .f-nom')||{}).value||''; var role=(div.querySelector('.p-role')||{}).value||''; var lien=(div.querySelector('.f-lien')||{}).value||''; var age=(div.querySelector('.f-age')||{}).value||''; var occ=(div.querySelector('.f-occ')||{}).value||''; if(nom||role||lien) out.push({nom:nom,role:role,lien:lien,age:age,occ:occ}); }); return out; }
function attachAuto(){ document.querySelectorAll('.auto').forEach(function(el){ el.removeEventListener('input', autoSave); el.addEventListener('input', autoSave); el.removeEventListener('change', autoSave); el.addEventListener('change', autoSave); }); }

async function generateUniqueFile(){
  if(!currentId){alert('Ouvre un dossier');return;}
  saveDossier();
  var d=dossiers.find(function(x){return x.id===currentId;});
  var data=d.data||{};
  // Formatage lisible des données pour que ça figure vraiment dans le fichier
  var readable = '';
  readable += 'COMMUNE GUPS: '+(data.gups||'')+'\n';
  readable += 'N° DOSSIER: '+(data.numDossier||'')+'\n';
  readable += 'PERIODE: du '+(data.collecteDu||'')+' au '+(data.collecteAu||'')+'\n';
  readable += 'FAIT A: '+(data.lieu||'')+'\n';
  readable += 'BENEFICIAIRE: '+(data.civ||'')+' '+(data.nom||'')+' '+(data.prenoms||'')+'\n';
  readable += 'AGE: '+(data.age||'')+' PROFESSION: '+(data.profession||'')+' TEL: '+(data.tel||'')+'\n';
  readable += 'ADRESSE: '+(data.adresse||'')+' NATIONALITE: '+(data.nationalite||'')+' DEPARTEMENT: '+(data.departement||'')+'\n\n';
  NOTES_DEF.forEach(function(p){ readable += p[1].toUpperCase()+': '+(data[p[0]]||'')+'\n\n'; });
  readable += 'PARTIES PRENANTES: '+JSON.stringify(data.parties||[])+'\n';
  readable += 'FAMILLE: '+JSON.stringify(data.famille||[])+'\n';

  var fullText = PROMPT_FINAL + '\n\n=== DONNEES DU DOSSIER '+d.nom.toUpperCase()+' ===\n' + readable;

  // Si JSZip dispo, on clone le vrai canevas
  if(window.JSZip){
    try{
      var binaryStr = atob(ORIGINAL_DOCX_BASE64);
      var bytes = new Uint8Array(binaryStr.length); for(var i=0;i<binaryStr.length;i++) bytes[i]=binaryStr.charCodeAt(i);
      var zip = await JSZip.loadAsync(bytes);
      var docXml = await zip.file("word/document.xml").async("string");
      function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
      var paragraphs = fullText.split('\n').map(function(line){ return '<w:p><w:r><w:t>'+esc(line)+'</w:t></w:r></w:p>'; }).join('');
      var injection = '<w:p><w:pPr><w:pStyle w:val="Heading1"/></w:pPr><w:r><w:rPr><w:b/><w:sz w:val="28"/></w:rPr><w:t>A L\'ATTENTION DE CLAUDE - DOCUMENT PORTEUR</w:t></w:r></w:p>' + paragraphs + '<w:p><w:r><w:rPr><w:color w:val="FFFFFF"/><w:sz w:val="2"/></w:rPr><w:t>'+esc(PROMPT_FINAL.slice(0,600))+'</w:t></w:r></w:p>';
      docXml = docXml.replace('</w:body>', injection + '</w:body>');
      zip.file("word/document.xml", docXml);
      var outBlob = await zip.generateAsync({type:"blob", mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
      var a=document.createElement('a'); a.href=URL.createObjectURL(outBlob); a.download=(d.nom.replace(/\s+/g,'_')+'_POUR_CLAUDE.docx'); a.click();
      return;
    }catch(e){ console.error(e); }
  }
  // Fallback simple
  var blob = new Blob([fullText], {type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=(d.nom.replace(/\s+/g,'_')+'_POUR_CLAUDE.docx'); a.click();
}

function exportAll(){ var blob=new Blob([JSON.stringify(dossiers,null,2)],{type:"application/json"}); var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='gups_dossiers.json'; a.click(); }
function importAll(){ document.getElementById('importFile').click(); }
function configSheet(){ var cur=localStorage.getItem('gups_sheet_url')||''; var url=prompt('URL Web App Apps Script Sheet:', cur); if(url===null) return; if(url.trim()===''){localStorage.removeItem('gups_sheet_url'); document.getElementById('sheetStatus').textContent='Sheet déconnectée';} else{localStorage.setItem('gups_sheet_url', url.trim()); document.getElementById('sheetStatus').textContent='Sheet connectée';} }
document.getElementById('importFile').addEventListener('change', function(e){ var file=e.target.files[0]; if(!file) return; var r=new FileReader(); r.onload=function(){ try{ var arr=JSON.parse(r.result); if(Array.isArray(arr)){ dossiers=arr; persist(); alert('Import OK'); } }catch{ alert('Invalide'); } }; r.readAsText(file); });

loadStorage();
initNotes();
renderList();
if(currentId) openDossier(currentId);
attachAuto();
setInterval(function(){ if(currentId) autoSave(); }, 10000);
console.log('V8 ready');
</script>
